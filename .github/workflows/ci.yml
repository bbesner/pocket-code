name: Pocket Code checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocket-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:release
      - run: npm test
      - name: Browser and accessibility tests
        shell: bash
        run: |
          export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome)"
          test -x "$PUPPETEER_EXECUTABLE_PATH"
          export POCKET_SCREENSHOTS="$RUNNER_TEMP/pocket-browser"
          npm run test:browser
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pocket-browser-evidence
          path: ${{ runner.temp }}/pocket-browser
          if-no-files-found: ignore
          retention-days: 7
